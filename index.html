<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HarcaTakip | Kişisel Gider Yönetimi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-light">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem("harcatakip_data");
        return saved ? JSON.parse(saved) : [
          { id: 1, title: "Market Alışverişi", amount: 850, category: "Gıda" },
          { id: 2, title: "İnternet Faturası", amount: 420, category: "Fatura" }
        ];
      });

      const [title, setTitle] = useState("");
      const [amount, setAmount] = useState("");
      const [category, setCategory] = useState("Gıda");
      const [editId, setEditId] = useState(null);

      useEffect(() => {
        localStorage.setItem("harcatakip_data", JSON.stringify(expenses));
      }, [expenses]);

      // Ekleme ve Güncelleme İşlemi
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim() || !amount) return;

        if (editId) {
          setExpenses(expenses.map(item =>
            item.id === editId ? { ...item, title, amount: Number(amount), category } : item
          ));
          setEditId(null);
        } else {
          setExpenses([...expenses, { id: Date.now(), title, amount: Number(amount), category }]);
        }
        setTitle("");
        setAmount("");
      };

      const handleEdit = (item) => {
        setEditId(item.id);
        setTitle(item.title);
        setAmount(item.amount);
        setCategory(item.category);
      };

      // Silme İşlemi
      const handleDelete = (id) => {
        setExpenses(expenses.filter(item => item.id !== id));
      };

      const total = expenses.reduce((acc, cur) => acc + cur.amount, 0);

      return (
        <div className="container py-5" style={{ maxWidth: "720px" }}>
          <div className="card shadow-sm border-0 mb-4">
            <div className="card-body p-4">
              <div className="d-flex justify-content-between align-items-center mb-3">
                <h3 className="fw-bold text-primary mb-0">HarcaTakip</h3>
                <span className="badge bg-dark fs-6">Toplam: {total} ₺</span>
              </div>

              <form onSubmit={handleSubmit} className="row g-2">
                <div className="col-md-5">
                  <input type="text" className="form-control" placeholder="Harcama adı..."
                    value={title} onChange={(e) => setTitle(e.target.value)} required />
                </div>
                <div className="col-md-3">
                  <input type="number" className="form-control" placeholder="Tutar (₺)"
                    value={amount} onChange={(e) => setAmount(e.target.value)} required />
                </div>
                <div className="col-md-2">
                  <select className="form-select" value={category} onChange={(e) => setCategory(e.target.value)}>
                    <option value="Gıda">Gıda</option>
                    <option value="Ulaşım">Ulaşım</option>
                    <option value="Fatura">Fatura</option>
                    <option value="Eğitim">Eğitim</option>
                  </select>
                </div>
                <div className="col-md-2 d-grid">
                  <button type="submit" className={`btn ${editId ? "btn-warning" : "btn-primary"}`}>
                    {editId ? "Güncelle" : "Ekle"}
                  </button>
                </div>
              </form>
            </div>
          </div>

          {/* Listeleme İşlemi[cite: 4] */}
          <div className="card shadow-sm border-0">
            <div className="card-body p-0">
              <table className="table table-hover mb-0 align-middle">
                <thead className="table-light">
                  <tr>
                    <th className="ps-4">Açıklama</th>
                    <th>Kategori</th>
                    <th>Tutar</th>
                    <th className="text-end pe-4">İşlemler</th>
                  </tr>
                </thead>
                <tbody>
                  {expenses.map((item) => (
                    <tr key={item.id}>
                      <td className="ps-4 fw-medium">{item.title}</td>
                      <td><span className="badge bg-secondary">{item.category}</span></td>
                      <td className="fw-bold">{item.amount} ₺</td>
                      <td className="text-end pe-4">
                        <button className="btn btn-sm btn-outline-warning me-2" onClick={() => handleEdit(item)}>Düzenle</button>
                        <button className="btn btn-sm btn-outline-danger" onClick={() => handleDelete(item.id)}>Sil</button>
                      </td>
                    </tr>
                  ))}
                  {expenses.length === 0 && (
                    <tr><td colSpan="4" className="text-center py-4 text-muted">Henüz harcama kaydı bulunmuyor.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
